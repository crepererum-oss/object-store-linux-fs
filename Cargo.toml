[package]
name = "object-store-linux-fs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.40", default-features = false }
futures-core = "0.3.34"
futures-util = "0.3.34"
lock_api = "0.5.0"
object_store = { version = "0.14.0", default-features = false }
parking_lot = "0.13.0"
rustix = { version = "1.1.6", features = ["fs"] }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
uuid = { version = "1.29.2", default-features = false, features = ["v4"] }

[dev-dependencies]
bitflags = "2.13.2"
indexmap = "2.14.2"
insta = "1.49.0"
object_store = { version = "0.14.0", default-features = false, features = ["integration"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros"] }
